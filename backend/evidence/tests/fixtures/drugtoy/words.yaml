# Topic words of the toy drug-trial pack (written for the test; Zelvora is an invented drug).
conditions:
  drug:
  - \bZelvora\b
  placebo:
  - (?i)\bplacebo\b
not_a_system: (?!\s+(?:effects?)\b)
metrics:
- - (?i)\bresponse\s+rate\b
  - response_rate
  - true
claim_subject: \bZelvora\b
claims:
- - (?i)\bimproves?\b
  - improves
gliner_labels:
  arm:
  - treatment arm
  outcome:
  - clinical outcome
fraction_metrics:
- response_rate
dataset_pattern: \b[A-Z][A-Za-z]+(?:Trial)\b
metric_supplement: []
screen_terms:
- Zelvora
query:
  arm: [Zelvora, placebo, arm]
  outcome: [response, rate]
  result: [patients, responded, response]
