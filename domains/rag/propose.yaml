# What `evidence propose` takes from this pack (D35: topic words live only in domains/): the hand-written
# protocols it drafts from, the topic options of its cards and the words filled into its prompts. Hand-moved
# from evidence/propose/{common.py,cards.py,cards.yaml,prompts/} at tag ev4 plan 1 (the filled text is unchanged).

# The example protocol of each question kind (evidence/propose/common.KIND_TEMPLATES): the effect template is
# rag-factuality.yaml with the funnel steps (regex -> abbrev -> GLiNER -> number -> LLM), like the templates
# of the other kinds, so an effect draft and its cascade card offer them too.
templates:
  effect: rag-factuality-funnel
  consistency: cons-accuracy
  inventory: inv-metrics
  best: best-accuracy

# The inventory protocol of each target type: a new list target brings its evidence type from it (card list_target).
inventory_templates:
  metric: inv-metrics
  condition: inv-methods
  dataset: inv-datasets

# The fixed options of the cards of evidence/propose/cards.yaml that name topic words, by card id; they follow
# the card's own options (if any), in this order.
card_options:
  best_metric:
    - id: factual_accuracy
      summary: factual accuracy, higher is better
      effect: "inside each paper the method kind with the highest factual_accuracy wins"
      value: {canonical: factual_accuracy, higher_is_better: true}
    - id: hallucination_rate
      summary: hallucination rate, lower is better
      effect: "inside each paper the method kind with the lowest hallucination_rate wins"
      value: {canonical: hallucination_rate, higher_is_better: false}
  method_kinds:
    - id: rag_vs_closed_book
      summary: two kinds, retrieval-augmented and no-retrieval
      effect: "conditions are sorted into no-retrieval and rag; a condition of any other kind is not ranked, and the answer is the kind with most wins inside papers"
      value:
        kinds:
          no-retrieval: [closed-book model, no-retrieval baseline, vanilla LLM, parametric-only model]
          rag: [retrieval-augmented model, RAG pipeline, retrieval-augmented generator, retrieve-then-read model]

# The <<NAME>> placeholders of evidence/propose/prompts/*.md (common.prompt fills them; none may be left).
prompt_words:
  FRACTION_EXAMPLE: hallucination rate 0.08
  SCORE_EXAMPLE: a BLEU score out of 100
  BEST_METRIC_EXAMPLE: |-
    best_metric, options factual_accuracy (effect "inside each paper the method kind with the highest factual_accuracy wins") and hallucination_rate (effect "... the lowest hallucination_rate wins"); the question asks which method hallucinates least.
      {"default": "hallucination_rate", "rationale": "The question asks for the least hallucination, and this option's effect is that the lowest hallucination_rate wins."}
