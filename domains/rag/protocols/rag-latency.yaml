# Research protocol: does retrieval augmentation change the latency of the answers? (question-first
# redesign, 25 Oct 2026). rag-factuality.yaml with latency as the only question metric: values are seconds
# (no [0, 1] bound), a lower time is better, 0.05 s is the neutral band. No author_claim type: the papers
# state no conclusion about latency, and the claim extractors read accuracy and hallucination claims.
# Written by hand; its sha256 is the digest of the parsed content (evidence/protocol.py).

id: rag-latency
version: 2
question: Does retrieval-augmented generation change the latency of LLM-generated answers?

locate:
  strategy: exhaustive        # exhaustive | bm25 | agent
  params:
    chunk_chars: 1500         # bm25: size of the ranked passages
    top_k: 6                  # bm25: passages kept per document and evidence type

screen:                       # per document, before any extraction (the funnel engine, Part D)
  question: >-
    Does the paper report an experiment that compares a retrieval-augmented system with the same model
    answering without retrieval?
  terms: [retrieval-augmented, retrieval augmented, RAG, retrieval, closed-book, without retrieval]
  extractors:
    - name: regex_screen      # no term in the paper: not relevant
    - name: llm_screen        # otherwise the model answers the question
  on_fail: skip               # skip | extract_anyway

evidence_types:
  condition:
    description: >-
      An experimental condition the paper compares: a system variant whose results are reported. role is
      rag for the retrieval-augmented system, baseline for the same model answering without retrieval
      (closed-book), other for anything else (ablations, other systems).
    fields:
      type: object
      additionalProperties: false
      required: [label, role]
      properties:
        label: {type: string, minLength: 1, description: the condition's name as the paper gives it}
        role: {type: string, enum: [rag, baseline, other], description: "rag, baseline or other"}
    roles: [condition_label]
    merge_key: [label, role]
    query: [retrieval, augmented, RAG, closed-book, baseline, without, variant, system, condition, compare]
    extractors:
      - name: regex_condition
      - name: abbrev_condition
      - name: gliner_condition
      - name: llm_condition

  metric:
    description: >-
      An evaluation metric the paper reports results on. canonical is latency for the time needed to produce an
      answer (latency, response time, seconds per answer), other for anything else (accuracy, hallucination
      rate, BLEU).
    fields:
      type: object
      additionalProperties: false
      required: [name, canonical, higher_is_better]
      properties:
        name: {type: string, minLength: 1, description: the metric's name as the paper gives it}
        canonical: {type: string, enum: [latency, other]}
        higher_is_better: {type: boolean}
    roles: [metric_label]
    merge_key: [name, canonical]
    query: [latency, seconds, time, response, speed, metric, measure, evaluate, cost]
    extractors:
      - name: regex_metric
        config:               # latency is the question metric; every other metric is other
          metrics: &latency_metrics
            - ['(?i)\blatency\b|\bLat\.', latency, false]
            - ['(?i)\bfactual(?:ity)?\s+accuracy\b|\baccuracy\b|\bexact[- ]match\b', other, true]
            - ['(?i)\bhallucination[- ]rate\b|\brate\s+of\s+hallucinat(?:ion|ions|ed\s+answers)\b', other, false]
            - ['\bBLEU\b|\bROUGE(?:-[12L])?\b', other, true]
      - name: abbrev_metric
        config: {metrics: *latency_metrics}
      - name: gliner_metric
        config: {metrics: *latency_metrics}
      - name: llm_metric

  measurement:
    description: >-
      One reported result: the value of one metric for one condition. A latency value is in seconds as the
      paper gives it (1.8 s is 1.8; 250 ms is 0.25); any other value is normalised to a fraction (62% is
      0.62). dataset is the dataset it was measured on, or null.
    fields:
      type: object
      additionalProperties: false
      required: [value, dataset]
      properties:
        value: {type: number, description: "seconds for latency, a fraction for accuracies and rates"}
        dataset: {type: [string, "null"], description: "the dataset, or null when the paper does not say"}
        form: {type: [string, "null"], enum: [plain, percent, fraction, k_of_n, range, plus_minus, null], description: "how the paper wrote the number (41 of 120 is k_of_n)"}
    links: {condition: condition, metric: metric}
    bounds:                   # seconds have no upper bound; a negative value is rejected (schema)
      - {field: value, min: 0}
    context: [condition, metric]
    roles: [value, condition_label, metric_label, value_total]   # value_total: the n of a count "k of n"
    merge_key: [value]
    query: [table, results, latency, seconds, faster, slower, compared]
    extractors:
      - name: regex_measurement_units   # seconds stay seconds; only fraction metrics are rate-like
        config: &latency_units {metrics: *latency_metrics, fraction_metrics: [factual_accuracy, hallucination_rate]}
      - name: number_measurement   # time units and ms headers read as seconds; fraction metrics as fractions
        config: *latency_units
      - name: llm_measurement


synthesis:                    # every rule parameter; the machinery is evidence/rules.py and evidence/synthesis.py
  compare: {treatment: rag, control: baseline}   # condition roles a study's pair is made of
  metrics:                    # the one question metric: a shorter time is better
    - {canonical: latency, higher_is_better: false}
  min_effect: 0.05            # |delta| below this (seconds) is neutral
  pairing:                    # treatment and control on the same dataset (first dataset in document order
    rule: same_dataset        # that has both); among several values of one condition, metric and dataset
    prefer: [table_cell, document_order]   # a table cell beats prose, then the earlier value wins
  claim_map: {improves: supports, worsens: contradicts, no_effect: neutral}   # required by the block; unused (no author_claim type)
  label:                      # the answer from the counts: the first row whose conditions all hold
    - {when: {supporting: ">0", contradicting: ">0"}, then: mixed}
    - {when: {supporting: ">0"}, then: supported}
    - {when: {contradicting: ">0"}, then: refuted}
    - {when: {neutral: ">0"}, then: no_effect}
    - {then: insufficient}
  flags:                      # reported in answer.json (Part F); only duplicates change the counts
    duplicates: true
    large_effect: {factor: 3.0, min_studies: 3}
