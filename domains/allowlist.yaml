# Generic words that are in a pack's words.yaml (as a pattern word, a term, an enum value or a display name) and
# may also appear in code (D35; evidence/tests/test_no_topic_words.py). Every entry says why the word is generic,
# not a word of one research topic. A topic word is never listed here: it moves into domains/<name>/.

# Words of any empirical study (pack: query terms, GLiNER labels, metric patterns)
- word: baseline
  reason: any comparative study has a baseline arm; the code names the control side of a comparison with it
- word: accuracy
  reason: a measure of correctness used in every empirical field; the code also scores checkers and models by it
- word: accura
  reason: the stem of `\baccura\w*` (accuracy, accurate, accuracies), as generic as "accuracy"; the code and the propose prompts say accuracy and accuracies
- word: dataset
  reason: every empirical paper reports the data it ran on; the code's context evidence type and table headers
- word: model
  reason: the code calls the LLM it runs "the model"; every field also has statistical models
- word: method
  reason: every paper has a method section and compares methods; a GLiNER label of any pack
- word: metric
  reason: any measured quantity; the code's evidence type role (Role.METRIC) and protocol key
- word: task
  reason: plain noun for a piece of work; the code's extraction task (ExtractionTask, task_sha256) and agent tasks;
    the ml pack's GLiNER label of its task type
- word: measure
  reason: plain verb for taking a value, in any field
- word: evaluate
  reason: plain verb for testing something, in any field
- word: evaluation
  reason: plain noun for a test of something; the repo's evaluation/ package
- word: score
  reason: any number on a scale; used for checker scores, BM25 scores and rating scales
- word: rate
  reason: any share or speed per unit, in any field; also a metric-noun word in abbrev.py and frame prompts
- word: results
  reason: every paper has a results section; the code's word for call and job outcomes
- word: table
  reason: results tables exist in every field; the code reads Markdown tables of any paper
- word: condition
  reason: an experimental arm in any field; the name of the compared-thing type and of `if` conditions
- word: variant
  reason: one version of anything compared; a system head noun of any domain
- word: system
  reason: plain noun for what is compared or built; also the system prompt and operating system
- word: setting
  reason: a configuration value or experimental setting in any field
- word: configuration
  reason: plain noun for set-up values; the code's own config
- word: pipeline
  reason: plain noun for a chain of steps; a system head noun of any domain
- word: approach
  reason: plain noun for a way of doing something; a system head noun of any domain
- word: generator
  reason: a Python term and the synthetic corpus generator; a system head noun of any domain
- word: conclusion
  reason: every paper states conclusions; the author-claim role of any pack
- word: effect
  reason: the question kind `effect` and any treatment effect, in any field
- word: compare
  reason: plain verb; every comparison question compares things
- word: compared
  reason: plain verb form of compare
- word: difference
  reason: plain noun; the difference of two measured values in any field
- word: significant
  reason: plain word (statistically significant), in any field
- word: latency
  reason: time to respond, measured in any engineered system; units.py converts any time unit, not a topic's
- word: exact
  reason: plain adjective; exact quotes, exact matching of spans
- word: match
  reason: plain verb and noun; regex matches, span matches, name matches
- word: correct
  reason: plain adjective; correct answers, correct spans in any field
- word: facts
  reason: plain noun; the answer rows' `facts` key of the agent's answer schema (a structural JSON field)
- word: answer
  reason: plain noun; the system's answer.json of any question
- word: answers
  reason: plural of answer
- word: check
  reason: plain verb and noun; the code's checks and checkers
- word: steps
  reason: plain noun; agent steps, funnel steps, cascade steps
- word: calls
  reason: plain noun; model calls and function calls
- word: errors
  reason: plain noun; call errors and exceptions
- word: failures
  reason: plain noun; failed calls and checks
- word: failed
  reason: plain verb form; a failed call or test
- word: fails
  reason: plain verb form; a call or check fails
- word: costs
  reason: plain noun; call costs, token costs
- word: other
  reason: plain word; also the `other` enum value every pack's roles and metrics fall back to
- word: unsupported
  reason: plain adjective; a value, quote or option the code does not support
- word: invented
  reason: plain verb form; an invented (made-up) quote that anchoring rejects

# Claim directions (pack enum values every effect claim of any field has)
- word: improves
  reason: a claim direction of any effect question (an author says X improves Y); also the improves relation in agent/kg.py
- word: worsens
  reason: a claim direction of any effect question; the opposite of improves
- word: no_effect
  reason: a claim direction of any effect question; neither improves nor worsens
- word: improve
  reason: plain verb behind the improves direction, in any field
- word: improvement
  reason: plain noun; a change for the better in any field
- word: hurts
  reason: plain verb; a claim word of any effect question (draft.py TYPE_WORDS)
- word: unchanged
  reason: plain adjective; a value or file that did not change
- word: change
  reason: plain verb and noun, in any field
- word: increases
  reason: plain verb; a change word next to a number in any field
- word: decreases
  reason: plain verb; a change word next to a number in any field
- word: boosts
  reason: plain verb; a change word next to a number in any field
- word: enhances
  reason: plain verb; a relation word of the agent's concept graph
- word: outperforms
  reason: plain verb; a relation of the agent's concept graph, any comparison
- word: reduce
  reason: plain verb, in any field
- word: lower
  reason: plain adjective (lower is better) and Python's str.lower
- word: fewer
  reason: plain adjective, in any field
- word: less
  reason: plain adjective, in any field
- word: more
  reason: plain adjective, in any field
- word: cuts
  reason: plain verb and noun; text cuts and cut-off points
- word: raise
  reason: Python's raise statement and a plain verb
- word: raises
  reason: Python docstrings ("raises PackError") and a plain verb
- word: raised
  reason: Python (an exception raised) and a plain verb
- word: reaches
  reason: plain verb; a value reaches a level, an agent reaches a step
- word: achieves
  reason: plain verb; a value a system achieves in any field
- word: yield
  reason: Python's yield statement and a plain verb
- word: lead
  reason: plain verb and noun; a lead the agent follows, a margin
- word: help
  reason: plain verb; also argparse help texts

# English function words and common verbs that claim patterns hold
- word: with
  reason: English preposition
- word: without
  reason: English preposition; also a negation word of any control condition ("without X")
- word: does
  reason: English auxiliary verb
- word: were
  reason: English auxiliary verb
- word: make
  reason: English verb
- word: matter
  reason: English verb and noun
- word: find
  reason: English verb; also re.find and the grep-like find commands
- word: show
  reason: English verb
- word: clear
  reason: English adjective and verb
- word: closed
  reason: English adjective (a closed pipe, a closed broker); the topic term closed-book is not allowlisted
- word: reader
  reason: plain noun for anything that reads (the number reader numreader.py, file readers, a human reader); the rag
    pack lists it as a system noun only in the sense of a reading component, which stays in words.yaml
- word: rag
  reason: the name of the first domain pack (domains/rag/), kept in old baseline command and run-folder names and in the
    committed example corpora (D36, old runs keep their names); a pack name, not a topic sentence
