# The web UI's checks on GitHub's machines (no local Node needed): types, lint, tests, and that
# src/api/schema.d.ts is what `npm run gen:api` makes from openapi.json.
name: frontend

on:
  push:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
