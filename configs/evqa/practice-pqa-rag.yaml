# Baseline: PaperQA2 fixed pipeline (Docs.aquery: retrieve chunks -> one summary per chunk -> answer), every practice question (22).
# Same model, papers and questions as practice-qwen / bench-qwen. thesis-baselines repo (submodule baselines/).
# Run: evqa run --config configs/evqa/practice-pqa-rag.yaml --text   (on the GPU job, like the evqa runs)
name: practice-pqa-rag
domain: medical
split: practice
questions: []            # empty = every question of the split
llm:
  backend: qwen
  model: orch-model
  think: false
system: paperqa2-rag
baseline:
  settings:              # PaperQA2 defaults except embedding (see baselines/thesis_baselines/paperqa2.py DEFAULTS)
    embedding: sparse    # PaperQA2's keyword embedding: no embedding model (Aditya, 21 Nov: light, no dense model)
