# Ablation (Q5): practice-qwen.yaml with one part switched off: extract.extras: false (no extra settings beyond the ones Spec listed).
# Run: evqa run --config configs/evqa/ablations/practice-ablate-extras-off.yaml   then compare: evqa compare <run dirs>
name: practice-ablate-extras-off
domain: medical
mode: benchmark
split: practice
questions: []            # empty = every question of the split
llm:
  backend: qwen
  model: orch-model
  think: false           # Qwen reasoning off (Aditya, 21 Nov)
steps: {}                # per-step override, e.g. spec_check: {backend: qwen, model: orch-model-2}
find:
  search_terms: true     # model lists other wordings; exact-word search (no BM25)
  screen_max_papers: 20
  agent_max_steps: 6
  agent: true
closed_book: false
extract:
  extras: false          # ABLATION: off
