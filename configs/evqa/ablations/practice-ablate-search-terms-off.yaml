# Ablation (Q5): practice-qwen.yaml with one part switched off: find.search_terms: false (no extra wordings from the model; exact-word search on the question words only).
# Run: evqa run --config configs/evqa/ablations/practice-ablate-search-terms-off.yaml   then compare: evqa compare <run dirs>
name: practice-ablate-search-terms-off
domain: medical
mode: benchmark
split: practice
questions: []            # empty = every question of the split
llm:
  backend: qwen
  model: orch-model
  think: false           # Qwen reasoning off (Aditya, 21 Nov)
steps: {}                # per-step override, e.g. spec_check: {backend: qwen, model: orch-model-2}
find:
  search_terms: false    # ABLATION: off
  screen_max_papers: 20
  agent_max_steps: 6
  agent: true
closed_book: false
