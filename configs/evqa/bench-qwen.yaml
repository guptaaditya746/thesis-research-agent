# Benchmark: every medical test question (174), benchmark mode (answers from the intent cards), every step on Qwen.
# Run: evqa run --config configs/evqa/bench-qwen.yaml  (on the GPU job: srun --jobid <job> --overlap ops/injob.sh ...)
name: bench-qwen
domain: medical
mode: benchmark
split: test
questions: []            # empty = every question of the split
llm:
  backend: qwen
  model: orch-model
  think: false           # Qwen reasoning off (Aditya, 21 Nov)
steps: {}                # per-step override, e.g. spec_check: {backend: qwen, model: orch-model-2}
find:
  search_terms: true     # model lists other wordings; exact-word search (no BM25)
  screen_max_papers: 20
  agent_max_steps: 6
  agent: true
closed_book: false
