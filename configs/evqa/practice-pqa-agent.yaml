# Baseline: PaperQA2 agent (the model picks tools: paper search, gather evidence, answer), every practice question (22).
# Needs tool calling on the gateway (vLLM --enable-auto-tool-choice with the Qwen tool parser); without it every
# question ends in "I cannot answer": use practice-pqa-agent-fixed.yaml then.
name: practice-pqa-agent
domain: medical
split: practice
questions: []
llm:
  backend: qwen
  model: orch-model
  think: false
system: paperqa2-agent
baseline:
  settings:
    embedding: sparse
    agent_type: ToolSelector   # PaperQA2 default
