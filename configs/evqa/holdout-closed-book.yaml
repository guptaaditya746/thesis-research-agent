# HOLD-OUT: score only. Never open its per-question outputs to fix code or prompts (docs/design/slice1.md).
# Benchmark closed book: every medical test question, no papers (Find returns nothing), so every answer should be
# "not reported". The ~0 sanity run: any value it reports came from the model, not from a paper.
name: holdout-closed-book
domain: medical_holdout
mode: benchmark
split: test
questions: []            # empty = every question of the split
llm:
  backend: qwen
  model: orch-model
  think: false           # Qwen reasoning off (Aditya, 21 Nov)
steps: {}                # per-step override, e.g. spec_check: {backend: qwen, model: orch-model-2}
find:
  search_terms: true     # model lists other wordings; exact-word search (no BM25)
  screen_max_papers: 20
  agent_max_steps: 6
  agent: true
closed_book: true
