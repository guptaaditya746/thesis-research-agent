# Four-domain benchmark (22 Nov 2026): llm, system pqa-rag; 40 questions (evqa/seed/pfbench.py),
# the passed papers of paperfactory run bench-llm. Same settings as configs/evqa/bench-pqa-rag.yaml.
# Run (GPU job): evqa run --config configs/evqa/bench4/llm-pqa-rag.yaml --text
name: bench4-llm-pqa-rag
domain: bench_llm
split: test
questions: []            # empty = every question of the split
llm:
  backend: qwen
  model: orch-model
  think: false
system: paperqa2-rag
baseline:
  settings:              # PaperQA2 defaults except embedding (see baselines/thesis_baselines/paperqa2.py DEFAULTS)
    embedding: sparse    # PaperQA2's keyword embedding: no embedding model (Aditya, 21 Nov: light, no dense model)
