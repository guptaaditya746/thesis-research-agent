# Four-domain benchmark (22 Nov 2026): medicine, system qwen; 40 questions (evqa/seed/pfbench.py),
# the passed papers of paperfactory run bench-medicine. Same settings as configs/evqa/bench-qwen.yaml.
# Run (GPU job): evqa run --config configs/evqa/bench4/medicine-qwen.yaml --text
name: bench4-medicine-qwen
domain: bench_medicine
mode: benchmark
split: test
questions: []            # empty = every question of the split
llm:
  backend: qwen
  model: orch-model
  think: false           # Qwen reasoning off (Aditya, 21 Nov)
steps: {}                # per-step override, e.g. spec_check: {backend: qwen, model: orch-model-2}
find:
  search_terms: true     # model lists other wordings; exact-word search (no BM25)
  screen_max_papers: 20
  agent_max_steps: 6
  agent: true
closed_book: false
