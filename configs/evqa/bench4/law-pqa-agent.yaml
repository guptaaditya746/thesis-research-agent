# Four-domain benchmark (22 Nov 2026): law, system pqa-agent; 40 questions (evqa/seed/pfbench.py),
# the passed papers of paperfactory run bench-law. Same settings as configs/evqa/bench-pqa-agent.yaml.
# Run (GPU job): evqa run --config configs/evqa/bench4/law-pqa-agent.yaml --text
name: bench4-law-pqa-agent
domain: bench_law
split: test
questions: []
llm:
  backend: qwen
  model: orch-model
  think: false
system: paperqa2-agent
baseline:
  settings:
    embedding: sparse
    agent_type: ToolSelector   # PaperQA2 default
