# Baseline: PaperQA2 agent tools in PaperQA2's fixed order (agent_type "fake": 3 model-written searches -> gather
# evidence -> answer), every medical test question (78), benchmark mode. No tool calling needed.
name: bench-pqa-agent-fixed
domain: medical
split: test
questions: []
llm:
  backend: qwen
  model: orch-model
  think: false
system: paperqa2-agent
baseline:
  settings:
    embedding: sparse
    agent_type: fake
