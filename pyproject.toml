[project]
name = "thesis-agent"
version = "0.1.0"
description = "Research agent with provenance recorded while it researches (milestone 1)"
requires-python = ">=3.13"
dependencies = [
    "jsonschema==4.25.1",
    "rdflib==7.6.0",
]

[project.scripts]
agent = "agent.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agent"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["agent/tests"]
