[project]
name = "thesis-agent"
version = "0.2.0"
description = "evqa: evidence QA over seeded papers, its evaluation and the Workbench web app"
requires-python = ">=3.13"
dependencies = [
    "dspy==3.4.1",
    "fastapi[standard]==0.143.0",
    "filelock==3.32.7",
    "httpx==0.28.1",
    "jsonschema==4.25.1",
    "pydantic-ai-slim[mcp,openai]==2.55.0",
    "pydantic-settings==2.15.0",
    "pyshacl==0.30.1",
    "pyyaml==6.0.3",
    "rapidfuzz>=3.14.6",
    "rdflib==7.6.0",
]

[project.scripts]
webapp = "webapp.cli:main"
evqa = "evqa.cli:main"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
]
frontend = ["nodejs-wheel==22.20.0"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["jsonio", "webapp", "modelcall", "repo_paths", "evqa"]
module-root = "backend"

[tool.pytest.ini_options]
addopts = "-n auto --timeout 600"
testpaths = ["backend"]
filterwarnings = ["ignore::DeprecationWarning:pyshacl.*", "ignore::DeprecationWarning:rdflib.*"]
