[project]
name = "thesis-agent"
version = "0.2.0"
description = "Research agent with provenance recorded while it researches, its gold standard, scoring and web app"
requires-python = ">=3.13"
dependencies = [
    "argilla==2.8.0",
    "fastapi[standard]==0.143.0",
    "httpx==0.28.1",
    "jsonschema==4.25.1",
    "mini-swe-agent==2.4.6",
    "numpy==2.5.4",
    "pandas==3.0.6",
    "pydantic-ai-slim[openai]==2.55.0",
    "pyoxigraph==0.5.11",
    "rdflib==7.6.0",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "sse-starlette==3.5.0",
    "statsmodels==0.15.0",
    "tabulate==0.9.0",
]

[project.scripts]
agent = "agent.cli:main"
gold = "gold.cli:main"
score = "scoring.cli:main"
webapp = "webapp.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2"]
frontend = ["nodejs-wheel==22.20.0"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["agent", "gold", "scoring", "webapp"]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["agent/tests", "gold/tests", "scoring/tests", "webapp/tests"]
