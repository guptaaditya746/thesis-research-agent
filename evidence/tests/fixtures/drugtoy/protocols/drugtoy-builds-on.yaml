# Toy builds-on protocol of the drugtoy pack (evidence/tests/test_builds_on_kind.py): which studies build on Zelvora,
# and how influential is it? The arms, the study labels (bylines) and the dependencies by the general LLM extractor.
# A dependency names the earlier study as cited (`cited`) and what it reuses; the arm it reuses is its link `thing`,
# optional (a reused dataset links none).

id: drugtoy-builds-on
domain: drugtoy
version: 2
question: Which later studies build on Zelvora, and how influential is it?
kind: builds_on

locate:
  strategy: exhaustive

evidence_types:
  arm:
    description: A trial arm; role is drug for a drug, placebo for the placebo arm.
    fields:
      type: object
      additionalProperties: false
      required: [label, role]
      properties:
        label: {type: string, minLength: 1}
        role: {type: string, enum: [drug, placebo, other]}
    roles: [condition_label]
    merge_key: [label, role]
    extractors:
      - name: llm

  study_label:
    description: The label the paper is cited by (its byline, author and year).
    fields:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label: {type: string, minLength: 1}
    roles: [label]
    extractors:
      - name: llm

  dependency:
    description: An earlier study this one builds on; cited is the label as written, reuses what it takes from it.
    fields:
      type: object
      additionalProperties: false
      required: [cited, reuses]
      properties:
        cited: {type: string, minLength: 1}
        reuses: {type: string, enum: [method, dataset, result]}
    links: {thing: arm}
    optional_links: [thing]
    context: [arm]
    roles: [citation]
    extractors:
      - name: llm

builds_on:
  thing: null
