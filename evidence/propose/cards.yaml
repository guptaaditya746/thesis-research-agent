# The fixed choice points of the proposal flow (docs/evidence-system.md Part E). The order and the ids are
# fixed; evidence/propose/cards.py holds, per id, the value's schema, how the value is read from a protocol
# and how a decision writes it back. `options` are offered on every proposal next to the draft's own value
# (option `draft`) and the model's proposal (option `model`, when it makes one). Every fixed option needs an `effect`: what the engine does with it,
# in plain terms, written by us (the model's rationale must not contradict it); the generated options get theirs
# from cards.py.
# `kinds` lists the question kinds that get the card; `advanced` cards (cascade, locate) are shown collapsed.

- id: screen
  title: Screening question and terms
  kinds: [effect, consistency, inventory, best]
  advanced: false
  ask: Which papers are in scope? The terms feed the keyword screen (a paper without any is skipped), the question the model's screen.
  sets: [screen.question, screen.terms]

- id: roles
  title: Treatment and control roles
  kinds: [effect, consistency]
  advanced: false
  ask: Which two condition roles is a study's pair made of, and what counts as each?
  sets: [synthesis.compare, evidence_types.condition.fields.role.enum, evidence_types.condition.description]

- id: metrics
  title: Question metrics and their direction
  kinds: [effect, consistency]
  advanced: false
  ask: Which metrics answer the question, in priority order, and is a higher value better?
  sets: [synthesis.metrics, evidence_types.metric.fields.canonical.enum]

- id: min_effect
  title: Smallest effect that counts
  kinds: [effect, consistency]
  advanced: false
  ask: Below which absolute difference is a study neutral?
  sets: [synthesis.min_effect]
  options:
    - id: strict
      summary: half a percentage point
      effect: "a study whose normalised difference is below 0.005 counts as neutral; this is a plain cut-off, not a significance test"
      value: {min_effect: 0.005}
    - id: usual
      summary: one percentage point
      effect: "a study whose normalised difference is below 0.01 counts as neutral; this is a plain cut-off, not a significance test"
      value: {min_effect: 0.01}
    - id: lenient
      summary: two percentage points
      effect: "a study whose normalised difference is below 0.02 counts as neutral; this is a plain cut-off, not a significance test"
      value: {min_effect: 0.02}

- id: pairing
  title: Pairing preference
  kinds: [effect, consistency]
  advanced: false
  ask: When one condition has several values for one metric and dataset, which value is the study's?
  sets: [synthesis.pairing.prefer]
  options:
    - id: table_first
      summary: a table cell beats prose, then the earlier value
      effect: "of several values for one condition, metric and dataset the one in a table cell is used, among equals the earlier in the document; prose, such as an abstract restating a result, loses to a table"
      value: {prefer: [table_cell, document_order]}
    - id: order_only
      summary: the earlier value, wherever it stands
      effect: "of several values for one condition, metric and dataset the earliest in the document is used, in a table or in prose"
      value: {prefer: [document_order]}

- id: label
  title: Label table
  kinds: [effect, consistency]
  advanced: false
  ask: Which label does the answer take from the counts of supporting, contradicting and neutral studies?
  sets: [synthesis.label]
  options:
    - id: any_evidence
      summary: any supporting study supports, unless some contradicts (mixed)
      effect: "one supporting study is enough for supported and one contradicting study for refuted; both give mixed; only neutral studies give no_effect; no study gives insufficient"
      value:
        rows:
          - {when: {supporting: ">0", contradicting: ">0"}, then: mixed}
          - {when: {supporting: ">0"}, then: supported}
          - {when: {contradicting: ">0"}, then: refuted}
          - {when: {neutral: ">0"}, then: no_effect}
          - {then: insufficient}
    - id: two_studies
      summary: a label needs at least two studies on its side
      effect: "supported needs more than one supporting study and no contradicting study (neutral studies are allowed); refuted needs more than one contradicting study and no supporting study; no_effect needs more than one neutral study and no supporting or contradicting study; more than one on each of supporting and contradicting gives mixed; anything else gives insufficient"
      value:
        rows:
          - {when: {supporting: ">1", contradicting: ">1"}, then: mixed}
          - {when: {supporting: ">1", contradicting: "==0"}, then: supported}
          - {when: {contradicting: ">1", supporting: "==0"}, then: refuted}
          - {when: {neutral: ">1", supporting: "==0", contradicting: "==0"}, then: no_effect}
          - {then: insufficient}

- id: claim_check
  title: How a claim is checked against the results
  kinds: [consistency]
  advanced: false
  ask: A study's author claim agrees with its results when what?
  sets: [consistency.by]
  options:
    - id: direction
      summary: the claimed direction equals the measured direction
      effect: "a study agrees when the direction its authors claim (the claim map's supports, contradicts or neutral) equals the direction of its measured difference; a study without a claim or without a measured pair is undetermined, not counted"
      value: {by: direction}

- id: list_target
  title: What the list holds
  kinds: [inventory]
  advanced: false
  ask: Which kind of item does the answer list, one entry for each distinct name?
  sets: [inventory.target, evidence_types]
  options:
    - id: metric
      summary: evaluation metrics
      effect: "only metric items are extracted; the answer lists each distinct metric name"
      value: {target: metric}
    - id: condition
      summary: methods or conditions
      effect: "only condition items are extracted; the answer lists each distinct method or condition name"
      value: {target: condition}
    - id: dataset
      summary: datasets
      effect: "only dataset items are extracted; the answer lists each distinct dataset name; no span is checked"
      value: {target: dataset}

- id: same_names
  title: Names that count as one entry
  kinds: [inventory]
  advanced: false
  ask: Which different names are the same item (a canonical name and the others it goes by)?
  sets: [inventory.same]
  options:
    - id: none
      summary: no merging
      effect: "every distinct name is its own entry in the list; two spellings of one item count twice"
      value: {same: {}}

- id: best_metric
  title: The metric that decides the best
  kinds: [best]
  advanced: false
  ask: Which metric ranks the methods inside a paper, and is a higher value better?
  sets: [best.metric]
  options: []   # the pack's options: domains/<pack>/propose.yaml card_options.best_metric

- id: method_kinds
  title: Method kinds and the conditions in each
  kinds: [best]
  advanced: false
  ask: Which method kinds are compared, and which condition names belong to each?
  sets: [best.kinds, evidence_types.condition.fields.kind.enum]
  options: []   # the pack's options: domains/<pack>/propose.yaml card_options.method_kinds

- id: win_rule
  title: Which value is a method's value in a paper
  kinds: [best]
  advanced: false
  ask: When one condition has several values for the metric and dataset, which value counts?
  sets: [best.pairing.prefer]
  options:
    - id: table_first
      summary: a table cell beats prose, then the earlier value
      effect: "of several values for one condition, metric and dataset the one in a table cell is used, among equals the earlier in the document; prose loses to a table"
      value: {prefer: [table_cell, document_order]}
    - id: order_only
      summary: the earlier value, wherever it stands
      effect: "of several values for one condition, metric and dataset the earliest in the document is used"
      value: {prefer: [document_order]}

- id: cascade
  title: Extractor cascade per type and funnel strategy
  kinds: [effect, consistency, inventory, best]
  advanced: true
  ask: Which extractors run for each evidence type, in which order, and does the run escalate only the gaps?
  sets: [evidence_types.*.extractors, run strategy (proposal.json run_settings)]

- id: locate
  title: Locate strategy
  kinds: [effect, consistency, inventory, best]
  advanced: true
  ask: Which parts of a paper do the extractors see?
  sets: [locate]
  options:
    - id: exhaustive
      summary: the whole paper
      effect: "the whole document; chunk and top_k are ignored"
      value: {strategy: exhaustive, params: {}}
    - id: bm25
      summary: the six best passages per type by the type's query terms
      effect: "per evidence type at most the 6 best-scoring passages (about 1500 characters each) that match at least one of the type's query terms are read; text outside them is never seen, so a value there is missed, and a paper with no matching passage is read not at all"
      value: {strategy: bm25, params: {chunk_chars: 1500, top_k: 6}}
