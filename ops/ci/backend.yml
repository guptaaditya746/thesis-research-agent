# Copy to .github/workflows/backend.yml (the Claude session token cannot push workflow files).
name: backend

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # no submodules: the tests do not need llm-setup (private)
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            external/paperorchestra/uv.lock

      - name: Install backend (no frontend group: Node is not needed)
        run: uv sync --locked

      # the paper-writer tests run the vendored PaperOrchestra as `uv run --project external/paperorchestra`
      - name: Install vendored PaperOrchestra env
        run: uv sync --locked --project external/paperorchestra

      - name: Lint
        run: uv run ruff check backend

      - name: Test
        run: uv run pytest -q
