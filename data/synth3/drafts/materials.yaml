field: materials science
arms:
- id: untreated
  label: Untreated alloy
  description: the alloy as cast, with no extra treatment
  control: true
- id: zerathane
  label: Zerathane Process
  description: a slow heat cycle that relaxes stress inside the metal
- id: quorvex
  label: Quorvex Coating
  description: a ceramic layer sprayed on the surface of the metal
- id: halvenite
  label: Halvenite Peening
  description: a surface treatment that hammers the metal with tiny beads
measures:
- id: tensile_strength
  name: Tensile strength
  kind: value
  higher_is_better: true
  effect: [0.15, 0.30]
  min_effect: 0.075
  min_gap: 0.15
  unit: MPa
  base_value: [400.0, 900.0]
  spread: 0.2
  decimals: 0
- id: cracked
  name: Cracked samples
  kind: count
  higher_is_better: false
  effect: [0.06, 0.10]
  min_effect: 0.03
  min_gap: 0.06
  unit: samples
  outcome: cracked during the test
  base_rate: [0.20, 0.40]
- id: hardness
  name: Hardness
  kind: value
  higher_is_better: true
  effect: [0.10, 0.25]
  min_effect: 0.05
  min_gap: 0.10
  unit: HV
  base_value: [150.0, 400.0]
  spread: 0.15
  decimals: 0
conditions:
- id: temperature
  name: Test temperature
  levels:
  - {id: room, name: Room temperature}
  - {id: hot, name: Raised temperature}
- id: thickness
  name: Sample thickness
  levels:
  - {id: thin, name: Thin samples}
  - {id: thick, name: Thick samples}
- id: lab
  name: Laboratory type
  from_setting: true
  levels:
  - {id: indus, name: Industrial laboratory}
  - {id: univ, name: University laboratory}
settings:
- {name: Northgate Metals Works, levels: {lab: indus}}
- {name: Riverside Foundry Lab, levels: {lab: indus}}
- {name: Maplewood Alloy Plant, levels: {lab: indus}}
- {name: Harbor Street Materials Group, levels: {lab: univ}}
- {name: Oakfield Metallurgy Unit, levels: {lab: univ}}
- {name: Willow Lane Materials Centre, levels: {lab: univ}}
n_range: [200, 800]
n_step: 50
head_to_head_rate: 0.15
overclaim_rate: 0.15
uncovered_rate: 0.4
