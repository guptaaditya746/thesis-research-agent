field: law
arms:
- id: standard
  label: Standard prosecution
  description: the usual route where every eligible case goes to trial or a plea deal
  control: true
- id: velmora
  label: Velmora Diversion
  description: a programme that sends first-time defendants to supervised community work instead of court
- id: castrelle
  label: Castrelle Pathway
  description: a programme that pairs defendants with a caseworker and a counselling plan before any charge is filed
- id: dunhaven
  label: Dunhaven Track
  description: a programme that settles cases through a mediated meeting between the defendant and the person harmed
measures:
- id: reoffending
  name: Reoffending
  kind: count
  higher_is_better: false
  effect: [0.06, 0.12]
  min_effect: 0.03
  min_gap: 0.06
  unit: defendants
  outcome: were charged again within a year
  base_rate: [0.25, 0.45]
- id: cases_closed
  name: Cases closed
  kind: count
  higher_is_better: true
  effect: [0.08, 0.14]
  min_effect: 0.04
  min_gap: 0.08
  unit: cases
  outcome: were closed within six months
  base_rate: [0.40, 0.60]
- id: days_to_resolution
  name: Days to resolution
  kind: value
  higher_is_better: false
  effect: [0.15, 0.30]
  min_effect: 0.075
  min_gap: 0.15
  unit: days
  base_value: [90.0, 180.0]
  spread: 0.5
  decimals: 0
conditions:
- id: offence
  name: Offence type
  levels:
  - {id: prop, name: Property offences}
  - {id: pers, name: Offences against a person}
- id: history
  name: Record of the defendant
  levels:
  - {id: first, name: First-time defendants}
  - {id: prior, name: Repeat defendants}
- id: court
  name: Court setting
  from_setting: true
  levels:
  - {id: urban, name: Urban courts}
  - {id: rural, name: Rural courts}
settings:
- {name: Northgate Circuit Courts, levels: {court: urban}}
- {name: Riverside Municipal Docket, levels: {court: urban}}
- {name: Maplewood District Bench, levels: {court: urban}}
- {name: Harbor Street Sessions, levels: {court: rural}}
- {name: Oakfield County Docket, levels: {court: rural}}
- {name: Willow Lane Circuit, levels: {court: rural}}
n_range: [200, 800]
n_step: 50
head_to_head_rate: 0.15
overclaim_rate: 0.15
uncovered_rate: 0.4
