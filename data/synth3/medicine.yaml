field: medicine
arms:
- id: standard
  label: Standard care
  description: the usual blood pressure treatment given to every patient
  control: true
- id: alvenor
  label: Alvenor
  description: a once daily tablet that relaxes the walls of the blood vessels
- id: brostamide
  label: Brostamide
  description: a water tablet that helps the body clear extra salt
- id: cardivel
  label: Cardivel
  description: a tablet that slows the heart so it pushes with less force
measures:
- id: bp_control
  name: Blood pressure control
  kind: count
  higher_is_better: true
  effect: [0.08, 0.14]
  min_effect: 0.04
  min_gap: 0.08
  unit: patients
  outcome: reached their target blood pressure
  base_rate: [0.40, 0.60]
- id: side_effects
  name: Side effects
  kind: count
  higher_is_better: false
  effect: [0.06, 0.10]
  min_effect: 0.03
  min_gap: 0.06
  unit: patients
  outcome: reported a side effect
  base_rate: [0.15, 0.30]
- id: systolic_drop
  name: Systolic drop
  kind: value
  higher_is_better: true
  effect: [0.15, 0.30]
  min_effect: 0.075
  min_gap: 0.15
  unit: mmHg
  base_value: [8.0, 14.0]
  spread: 0.5
  decimals: 1
conditions:
- id: age
  name: Age group
  levels:
  - {id: yng, name: Younger adults}
  - {id: eld, name: Older adults}
- id: kidney
  name: Kidney status
  levels:
  - {id: norm, name: Normal kidney function}
  - {id: red, name: Reduced kidney function}
- id: care
  name: Care level
  from_setting: true
  levels:
  - {id: univ, name: University hospital}
  - {id: comm, name: Community clinic}
settings:
- {name: Northgate Heart Cohort, levels: {care: univ}}
- {name: Riverside Pressure Registry, levels: {care: univ}}
- {name: Maplewood Cardiac Group, levels: {care: univ}}
- {name: Harbor Street Patients, levels: {care: comm}}
- {name: Oakfield Family Cohort, levels: {care: comm}}
- {name: Willow Lane Cohort, levels: {care: comm}}
n_range: [200, 800]
n_step: 50
head_to_head_rate: 0.15
overclaim_rate: 0.15
uncovered_rate: 0.4
