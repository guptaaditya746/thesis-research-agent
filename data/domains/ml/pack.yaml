# The ML-papers pack (spec 6.12, D21): the names of methods, datasets, tasks and metrics, as SciREX labels them,
# and (from Task 10, F9) measured values for SciLead. `metric`, `dataset` and `measurement` reuse the rag pack's
# prefixes (the item-prefix registry is global, F37); `method` and `task` take prefixes no other pack uses.
name: ml
types:
  method: {prefix: mt, role: compared_thing, name_field: name}
  dataset: {prefix: d, role: context, name_field: name}
  task: {prefix: tk, role: context, name_field: name}
  metric: {prefix: k, role: metric, name_field: name}
  measurement: {prefix: m, role: measured_value}
display: {}
names_seed: {}
limitation_categories: []
ontology:
  roles: {compared_thing: "cskg:Method", metric: "cskg:Metric", context: "cskg:Material"}
