# Blueprint of the materials seed (draft v2, 21 Nov 2026). Written by hand; built by code only:
#   uv run python -m evqa.seed.rebuild materials --in-place --seed-only     (seed.ttl here)
#   uv run python -m evqa.seed.rebuild materials --out <dir>                (seed + question set into <dir>)
# Same generator as data/seed/medical: every value comes from the effect model below (fixed random seed); this file
# declares every domain word (items, settings, measures, effect model, intent cards, question templates).
# All alloy names, codes, compositions and numbers are invented fixtures; they are not real material properties.
# No papers are written from this yet: that waits for the Qwen writer (docs/design/qwen-writer.md) and Aditya's go.
# Draft v1 (hand-listed rows, design cases only) is replaced: its specimen-orientation setting lives on as a
# specimen state (annealed_transverse), because the seed schema has one context, one factor and one time per row.
domain: materials
random_seed: 20261122

items:   # fixed made-up names (no LLM naming step), split by alloy family: a, b practice; c, d, e test
  alloy_a: {label: "Varnel-A", code: "VA-17", made_up: true, composition: "Al 94%, Mg 4%, Zn 2% by mass"}
  alloy_b: {label: "Korven-B", code: "KB-32", made_up: true, composition: "Al 91%, Mg 6%, Zn 3% by mass"}
  alloy_c: {label: "Selmar-C", code: "SC-46", made_up: true, composition: "Fe 93%, Cr 5%, Ni 2% by mass"}
  alloy_d: {label: "Tervin-D", code: "TD-58", made_up: true, composition: "Fe 89%, Cr 8%, Ni 3% by mass"}
  alloy_e: {label: "Ostrel-E", code: "OE-71", made_up: true, composition: "Cu 88%, Sn 10%, P 2% by mass"}

contexts:   # what was measured: the specimen state
  as_cast: {label: "as-cast specimens"}
  annealed: {label: "annealed specimens"}
  cold_rolled: {label: "cold-rolled specimens"}
  annealed_transverse: {label: "annealed specimens cut transverse to the rolling direction"}

factors:
  test_temperature: {label: "test temperature", unit: "unit:DEG_C"}

# value = s0 * (1 - soft * (temperature - 20) / 100) * (1 + gain * (1 - exp(-hours / tau))) * state_factor + noise
# Every value is the mean of the tested specimens (no comparator).
measures:
  yield_strength:
    label: "yield strength"
    alt: ["0.2% proof stress", "YS"]
    unit: unit:MegaPA
    higher_is_better: true
    decimals: 0
    tau: 6
    noise_sd: 3
  elongation:
    label: "elongation at break"
    alt: ["elongation", "strain at fracture"]
    unit: unit:PERCENT
    higher_is_better: true
    decimals: 1
    tau: 6
    noise_sd: 0.3
  vickers_hardness:
    label: "Vickers hardness"
    alt: ["HV", "hardness"]
    unit: ex:VickersHardness
    higher_is_better: true
    decimals: 0
    tau: 8
    noise_sd: 2

alloys:   # effect model per alloy and measure: [s0 at 20 C unaged, softening per 100 C, ageing gain]
  alloy_a: {yield_strength: [240, 0.18, 0.25], elongation: [12.0, -0.10, -0.20]}
  alloy_b: {yield_strength: [260, 0.15, 0.30], elongation: [10.0, -0.08, -0.25]}
  alloy_c: {yield_strength: [430, 0.10, 0.15], elongation: [18.0, -0.05, -0.10]}
  alloy_d: {yield_strength: [470, 0.09, 0.20], elongation: [15.0, -0.06, -0.15]}
  alloy_e: {vickers_hardness: [150, 0.05, 0.20]}

state_factor:
  as_cast: {yield_strength: 0.85, elongation: 0.70, vickers_hardness: 0.90}
  annealed: {yield_strength: 1.0, elongation: 1.0, vickers_hardness: 1.0}
  cold_rolled: {yield_strength: 1.25, elongation: 0.60, vickers_hardness: 1.20}
  annealed_transverse: {yield_strength: 0.93, elongation: 0.85, vickers_hardness: 1.0}

# Each paper: alloy x test temperatures x ageing times x measures (several alloys: `arms: [{alloy, temperatures}]`).
# Roles use the seed schema's list (shapes.ttl). `scale` + `conflict_with`: a deliberate conflict, as in medical.
papers:
  - id: P-mat-01
    role: hub
    split: practice
    kind: lab
    title: "Tensile properties of annealed {alloy_a} at two test temperatures"
    alloy: alloy_a
    state: annealed
    temperatures: [20, 200]
    hours: [8, 24]
    measures: [yield_strength, elongation]
    conflict_with: [P-mat-03]
  - id: P-mat-02
    role: near_miss
    split: practice
    kind: lab
    title: "As-cast {alloy_a} at room temperature"
    alloy: alloy_a
    state: as_cast
    temperatures: [20]
    hours: [24]
    measures: [yield_strength]
  - id: P-mat-03
    role: conflict
    split: practice
    kind: lab
    title: "Independent tensile tests of annealed {alloy_a_code}"
    alloy: alloy_a
    state: annealed
    temperatures: [20]
    hours: [24]
    measures: [yield_strength]
    scale: 0.9
    conflict_with: [P-mat-01]
    names: {alloy_a: code}
  - id: P-mat-04
    role: trend
    split: practice
    kind: lab
    title: "Ageing response of annealed {alloy_b} over 32 hours"
    alloy: alloy_b
    state: annealed
    temperatures: [20]
    hours: [2, 4, 8, 16, 32]
    measures: [yield_strength, elongation]
  - id: P-mat-05
    role: near_miss
    split: practice
    kind: lab
    title: "Transverse specimens of annealed {alloy_b}: yield strength at 20 and 150 C"
    alloy: alloy_b
    state: annealed_transverse
    temperatures: [20, 150]
    hours: [8]
    measures: [yield_strength]
  - id: P-mat-06
    role: hub
    split: test
    kind: lab
    title: "Temperature dependence of annealed {alloy_c} after ageing"
    alloy: alloy_c
    state: annealed
    temperatures: [25, 200, 350]
    hours: [8, 24]
    measures: [yield_strength, elongation]
    conflict_with: [P-mat-08]
  - id: P-mat-07
    role: near_miss
    split: test
    kind: lab
    title: "As-cast {alloy_c} in a tensile test"
    alloy: alloy_c
    state: as_cast
    temperatures: [25]
    hours: [24]
    measures: [yield_strength, elongation]
  - id: P-mat-08
    role: conflict
    split: test
    kind: lab
    title: "Repeat measurements of {alloy_c} ({alloy_c_code}) at ambient temperature"
    alloy: alloy_c
    state: annealed
    temperatures: [25]
    hours: [24]
    measures: [yield_strength]
    scale: 0.88
    conflict_with: [P-mat-06]
    names: {alloy_c: both}
  - id: P-mat-09
    role: multi_arm
    split: test
    kind: lab
    title: "{alloy_c} and {alloy_d} compared after 12 hours of ageing"
    arms: [{alloy: alloy_c, temperatures: [25]}, {alloy: alloy_d, temperatures: [25]}]
    state: annealed
    hours: [12]
    measures: [yield_strength, elongation]
  - id: P-mat-10
    role: trend
    split: test
    kind: lab
    title: "Ageing of cold-rolled {alloy_d} from 1 to 64 hours"
    alloy: alloy_d
    state: cold_rolled
    temperatures: [25]
    hours: [1, 4, 16, 64]
    measures: [yield_strength, elongation]
  - id: P-mat-11
    role: dose_ranging      # the schema's name for "one factor at several values": four test temperatures
    split: test
    kind: lab
    title: "Yield strength of annealed {alloy_d} from 25 to 300 C"
    alloy: alloy_d
    state: annealed
    temperatures: [25, 100, 200, 300]
    hours: [24]
    measures: [yield_strength]
  - id: P-mat-12
    role: distractor        # an alloy and measure no question asks about
    split: test
    kind: lab
    title: "Hardness of annealed {alloy_e} after short ageing"
    alloy: alloy_e
    state: annealed
    temperatures: [25]
    hours: [4, 8]
    measures: [vickers_hardness]

generator:
  subject: {noun: alloy, paper_key: alloy, arms_key: arms}
  comparator: {default: null}           # values are specimen means, compared with nothing
  statistic: MeanValue
  context: {slot: state, section: contexts, paper_key: state, noun: specimen state}
  factor:
    slot: temperature
    section: factors
    arm_key: temperatures
    node: "temperature-{}C"
    cell: "{} °C"
    phrase: "{} °C"
    noun: test temperature
    mention: '(?<![\d.]){n}\s*(°\s*c\b|degrees?\s+c|c\b)'
  time:
    slot: hours
    paper_key: hours
    unit: "unit:HR"
    cell: "{} h"
    phrase: "{} h"
    noun: ageing time
    mention: '(?<![\d.]){n}\s*-?\s*(h\b|hours?\b|hr\b)'
    extra: [1, 2, 48, 100, 500]
  effect:
    formula: "s0 * (1 - soft * (temperature - 20) / 100) * (1 + gain * (1 - exp(-hours / tau))) * state_factor"
    params:
      s0: [alloys, "{subject}", "{measure}", 0]
      soft: [alloys, "{subject}", "{measure}", 1]
      gain: [alloys, "{subject}", "{measure}", 2]
      tau: [measures, "{measure}", tau]
      state_factor: [state_factor, "{state}", "{measure}"]
    noise_sd: [measures, "{measure}", noise_sd]
  direction: {higher: [higher, highest], lower: [lower, lowest]}
  intent:
    test_temperature: {label: test temperature, ask: "Which test temperature do you mean?",
                       answer: "Show every test temperature reported, one per row.", column: temperature}
    ageing_time: {label: ageing time, ask: "Which ageing time do you mean?",
                  answer: "Show every ageing time reported, one per row.", column: hours}
    specimen_state: {label: specimen state, ask: "Which specimen state do you mean?",
                     answer: "Show every specimen state, kept apart.", column: state}
    measure_variant:
      label: what the value is
      ask: "Which value do you mean?"
      answer: "The mean measured value of the tested specimens, in the unit the papers use."
      rule: {statistic: MeanValue}
    difference:
      label: how the difference is measured
      ask: "How should the difference be measured?"
      answer: "The difference between the two mean values, in the unit the papers use."
      rule: {statistic: MeanValue}
    other_names: {label: other names, ask: "Do you know other names for these?",
                  answer: "I know no other names. Use the names in the question."}
  open_points: {factor: test_temperature, time: ageing_time, context: specimen_state}
  measure_variant: measure_variant
  difference_variant: difference
  candidate_labels: {factor: test temperature, subject: alloy}
  questions: {materials: []}            # no hand-written questions: the whole set is generated
  bench:
    quota: {lookup: 6, effect: 0, best: 4, trend: 4, list: 4, conflict: 2,
            absent: 8, near_miss: 6, out_of_scope: 6}
    out_of_scope_subjects: [Inconel 718, Ti-6Al-4V, AA7075, AISI 304, Hastelloy X, Zircaloy-4]
    out_of_scope_topics:
      - ["fatigue life", ["fatigue"]]
      - ["corrosion rate", ["corrosion"]]
      - ["thermal conductivity", ["thermal conductivity", "conductivity"]]
      - ["fracture toughness", ["toughness", "fracture"]]
      - ["creep rupture time", ["creep", "rupture"]]
    context_variants:
      - {name: quenched, sub: '^annealed specimens$', with: "quenched specimens", terms: [quench]}
      - {name: hot_rolled, sub: '^cold-rolled', with: "hot-rolled", terms: [hot-rolled, hot rolled]}
      - {name: welded, sub: '^annealed specimens$', with: "welded annealed specimens", terms: [weld]}
      - {name: additive, sub: '^as-cast', with: "additively manufactured", terms: [additive]}
    templates:
      lookup_subject: [item, "What {measure} does {subject} show?"]
      lookup_factor: [temperature, "What is the {measure} of {subject} tested at {factor}?"]
      lookup_time: [ageing_time, "What is the {measure} of {subject} after {time} of ageing?"]
      lookup_context: [state, "What is the {measure} of {subject} in {context}?"]
      trend_over_time: [over_time, "How does the {measure} of {subject} tested at {factor} change with ageing time?"]
      trend_over_factor: [over_temperature,
                          "How does the {measure} of {subject} after {time} of ageing change with test temperature?"]
      best_factor_any_context: [temperature_any_state,
                                "At which test temperature does {subject} show the {verbs} {measure} after {time} of ageing?"]
      best_factor: [temperature,
                    "At which test temperature does {subject} show the {verbs} {measure} after {time} of ageing in {context}?"]
      best_subjects: [items, "Which alloy shows the {verb} {measure} after {time} of ageing, {subject} or {subject_b}?"]
      conflict: [temperature_time, "What {measure} does {subject} show at {factor} after {time} of ageing?"]
      list_subject_measure: [item_measure, "Which studies report the {measure} of {subject}?"]
      list_subject: [item, "Which studies tested {subject}?"]
      list_subject_context: [item_state, "Which studies tested {subject} in {context}?"]
      list_measure_context: [measure_state, "Which studies report the {measure} of {context}?"]
      effect_subject: [item, "Does {subject} show a {verb} {measure} than {than}?"]
      effect_factor: [temperature, "Does {subject} at {factor} show a {verb} {measure} than {than}?"]
      than_default: "{comparator}"
      than_active: "{comparator}"
      active_suffix: _vs_active
      absent_time: [ageing_time, "What is the {measure} of {subject} tested at {factor} after {time} of ageing?",
                    "no paper reports {subject} at {factor} on {measure} after {time} of ageing (reported ageing times: {times} h)"]
      absent_context: [state, "What is the {measure} of {subject} in {context}?",
                       "no paper reports {subject} on {measure} in {context}"]
      absent_measure: [measure, "What {measure} does {subject} show?",
                       "no paper reports {subject} on {measure} (its papers report: {have})"]
      near_miss_context: [state, "What is the {measure} of {subject} in {context}?",
                          "no paper reports {subject} on {measure} in {context}; the closest rows are for {real}"]
      near_miss_factor: [temperature, "What is the {measure} of {subject} tested at {factor}?",
                         "no paper reports {subject} at {factor} on {measure}; the closest test temperature(s) reported: {around}"]
      out_of_scope_subject: [item, "What {measure} does {subject} show?",
                             "{subject} appears in no paper and nowhere in the seed"]
      out_of_scope_topic: [topic, "What is the {topic} of {subject}?",
                           "{topic} appears in no paper and nowhere in the seed"]
