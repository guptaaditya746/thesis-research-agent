# Blueprint of the HOLD-OUT medical seed (made 21 Nov 2026). Same generator, same kinds of papers and questions as
# data/seed/medical, but a new world: new made-up drugs, new numbers (other random seed and effect model), two new
# patient groups, other doses and weeks. Every paper is "test": nobody tunes on this domain. The pipeline is run on
# it only to report a score; its run folders are not opened to fix prompts or code (docs/design/slice1.md, Hold-out).
domain: medical_holdout
random_seed: 20261121
avoid_names_from: [medical]   # made-up names must also differ from the medical seed's names

items:
  drug_a: {invent: "oral once-daily glucose-lowering drug, the main drug of this dataset"}
  drug_b: {invent: "oral once-daily glucose-lowering drug from a second company"}
  drug_c: {invent: "oral once-daily glucose-lowering drug, the second main drug of this dataset"}
  drug_d: {invent: "oral once-daily glucose-lowering drug, often called by its development code"}
  drug_e: {invent: "oral once-daily drug that lowers glucose and body weight"}
  drug_f: {invent: "oral once-daily drug that lowers blood pressure and LDL cholesterol in diabetes"}
  drug_g: {invent: "oral once-daily glucose-lowering drug, studied in people on insulin"}
  placebo: {label: placebo, mesh: D010919}
  sitagliptin: {label: sitagliptin, mesh: D000068900}   # a real active comparator only, never a subject

contexts:
  t2d_metformin: {label: "adults with type 2 diabetes on metformin", mesh: D003924}
  t2d_naive: {label: "adults with newly diagnosed type 2 diabetes, no prior drug", mesh: D003924}
  t2d_elderly: {label: "adults aged 70 years or older with type 2 diabetes on metformin", mesh: D003924}
  t2d_obese: {label: "adults with type 2 diabetes and obesity on metformin", mesh: D003924}
  t2d_insulin: {label: "adults with type 2 diabetes on basal insulin", mesh: D003924}
  t2d_hypertension: {label: "adults with type 2 diabetes and high blood pressure on metformin", mesh: D003924}

factors:
  daily_dose: {label: "daily dose", unit: "unit:MilliGM"}

# effect = emax * dose / (ed50 + dose) * (1 - exp(-week / tau)) * context factor + noise, rounded to `decimals`.
# All values are mean differences vs placebo (negative = lower than placebo).
measures:
  hba1c_change:
    label: "change in HbA1c from baseline"
    alt: ["HbA1c reduction", "ΔHbA1c", "change in glycated haemoglobin"]
    mesh: D006442
    unit: ex:PercentagePoint
    higher_is_better: false
    decimals: 2
    tau: 7
    noise_sd: 0.04
  weight_change:
    label: "change in body weight from baseline"
    alt: ["weight change", "body-weight change"]
    mesh: D001835
    unit: unit:KiloGM
    higher_is_better: false
    decimals: 1
    tau: 12
    noise_sd: 0.15
  fpg_change:
    label: "change in fasting plasma glucose from baseline"
    alt: ["FPG change", "change in fasting glucose"]
    mesh: D001786
    unit: unit:MilliMOL-PER-L
    higher_is_better: false
    decimals: 2
    tau: 3
    noise_sd: 0.05
  sbp_change:
    label: "change in systolic blood pressure from baseline"
    alt: ["SBP change", "change in systolic BP"]
    mesh: D001794
    unit: unit:MilliM_HG
    higher_is_better: false
    decimals: 1
    tau: 5
    noise_sd: 0.4
  ldl_change:
    label: "change in LDL cholesterol from baseline"
    alt: ["LDL-C change", "change in low-density lipoprotein cholesterol"]
    mesh: D008078
    unit: unit:MilliMOL-PER-L
    higher_is_better: false
    decimals: 2
    tau: 5
    noise_sd: 0.03

drugs:   # effect model per drug and measure: [emax, ed50 in mg]
  drug_a: {hba1c_change: [-1.15, 6], weight_change: [-1.6, 8], fpg_change: [-1.45, 6]}
  drug_b: {hba1c_change: [-1.05, 25], weight_change: [0.6, 25], fpg_change: [-1.25, 25]}
  drug_c: {hba1c_change: [-1.35, 15], weight_change: [-2.8, 20], fpg_change: [-1.70, 15]}
  drug_d: {hba1c_change: [-0.90, 50], weight_change: [-0.4, 60], fpg_change: [-1.10, 50]}
  drug_e: {hba1c_change: [-0.95, 10], weight_change: [-3.4, 12], fpg_change: [-1.05, 10], sbp_change: [-3.5, 10]}
  drug_f: {hba1c_change: [-0.25, 3], sbp_change: [-8.5, 3], ldl_change: [-0.55, 3]}
  drug_g: {hba1c_change: [-1.00, 8], weight_change: [0.9, 8], fpg_change: [-1.30, 8]}
  sitagliptin: {hba1c_change: [-0.75, 30], weight_change: [0.1, 30]}

context_factor: {t2d_metformin: 1.0, t2d_naive: 1.2, t2d_elderly: 0.85, t2d_obese: 1.05, t2d_insulin: 0.8,
                 t2d_hypertension: 1.0}

# Paper fields as in data/seed/medical/blueprint.yaml.
papers:
  - id: P-mho-01
    role: hub
    split: test
    kind: RCT
    title: "{drug_a} added to metformin in type 2 diabetes: a 26-week dose-ranging trial"
    drug: drug_a
    context: t2d_metformin
    doses: [5, 10, 20]
    weeks: [13, 26]
    measures: [hba1c_change, weight_change, fpg_change]
    conflict_with: [P-mho-05]
  - id: P-mho-02
    role: series
    split: test
    kind: RCT
    title: "{drug_a} with metformin: extension of the dose-ranging trial to week 78"
    drug: drug_a
    context: t2d_metformin
    doses: [10, 20]
    weeks: [52, 78]
    measures: [hba1c_change, weight_change]
  - id: P-mho-03
    role: hub
    split: test
    kind: RCT
    title: "{drug_b} as add-on to metformin: a 26-week placebo-controlled trial"
    drug: drug_b
    context: t2d_metformin
    doses: [25, 50]
    weeks: [13, 26]
    measures: [hba1c_change, weight_change, fpg_change]
  - id: P-mho-04
    role: near_miss         # obese adults, not plain "on metformin"
    split: test
    kind: RCT
    title: "{drug_a} in adults with type 2 diabetes and obesity"
    drug: drug_a
    context: t2d_obese
    doses: [10, 20]
    weeks: [26]
    measures: [hba1c_change, weight_change]
  - id: P-mho-05
    role: conflict          # 10 mg at week 26 clashes with P-mho-01 (larger effects)
    split: test
    kind: RCT
    title: "{drug_a} with metformin in type 2 diabetes: a multinational 26-week trial"
    drug: drug_a
    context: t2d_metformin
    doses: [10]
    weeks: [26]
    measures: [hba1c_change, fpg_change]
    scale: 1.6
    conflict_with: [P-mho-01]
  - id: P-mho-06
    role: dose_ranging      # best dose (4 candidates)
    split: test
    kind: RCT
    title: "{drug_c} added to metformin: a 24-week dose-finding trial"
    drug: drug_c
    context: t2d_metformin
    doses: [5, 15, 30, 60]
    weeks: [12, 24]
    measures: [hba1c_change, weight_change]
  - id: P-mho-07
    role: trend             # same drug, dose and measure at 5 time points
    split: test
    kind: RCT
    title: "{drug_c} as first treatment in newly diagnosed type 2 diabetes: 60-week results"
    drug: drug_c
    context: t2d_naive
    doses: [30]
    weeks: [6, 12, 24, 36, 60]
    measures: [hba1c_change, weight_change]
  - id: P-mho-08
    role: near_miss         # older adults, 45 mg (between 30 and 60)
    split: test
    kind: RCT
    title: "{drug_c} in adults aged 70 or older with type 2 diabetes"
    drug: drug_c
    context: t2d_elderly
    doses: [45]
    weeks: [24]
    measures: [hba1c_change, fpg_change]
  - id: P-mho-09
    role: alias             # drug_d only by its code; P-mho-11 links code and name
    split: test
    kind: RCT
    title: "{drug_d_code} added to metformin in type 2 diabetes: a 24-week trial"
    drug: drug_d
    context: t2d_metformin
    doses: [100, 200]
    weeks: [12, 24]
    measures: [hba1c_change, weight_change, fpg_change]
    names: {drug_d: code}
  - id: P-mho-10
    role: dose_ranging      # best dose for drug_d
    split: test
    kind: RCT
    title: "Dose range of {drug_d} in newly diagnosed type 2 diabetes"
    drug: drug_d
    context: t2d_naive
    doses: [50, 100, 200, 400]
    weeks: [24]
    measures: [hba1c_change, fpg_change]
  - id: P-mho-11
    role: multi_arm         # three drugs vs one placebo; names and codes together
    split: test
    kind: RCT
    title: "{drug_c}, {drug_d} and {drug_e} added to metformin: a three-arm placebo-controlled trial"
    arms: [{drug: drug_c, doses: [30]}, {drug: drug_d, doses: [200]}, {drug: drug_e, doses: [20]}]
    context: t2d_metformin
    weeks: [26]
    measures: [hba1c_change, weight_change, fpg_change]
    names: {drug_c: both, drug_d: both, drug_e: both}
  - id: P-mho-12
    role: head_to_head      # against a real active drug, not placebo
    split: test
    kind: RCT
    title: "{drug_b} versus sitagliptin added to metformin: a 52-week head-to-head trial"
    drug: drug_b
    comparator: sitagliptin
    comparator_dose: 100
    context: t2d_metformin
    doses: [50]
    weeks: [26, 52]
    measures: [hba1c_change, weight_change]
  - id: P-mho-13
    role: hub               # weight-loss drug in obesity
    split: test
    kind: RCT
    title: "{drug_e} for glucose and body weight in type 2 diabetes with obesity"
    drug: drug_e
    context: t2d_obese
    doses: [10, 20, 40]
    weeks: [12, 26]
    measures: [weight_change, hba1c_change, sbp_change]
  - id: P-mho-14
    role: trend             # dose series at one week
    split: test
    kind: RCT
    title: "{drug_e} added to metformin: five doses over 24 weeks"
    drug: drug_e
    context: t2d_metformin
    doses: [5, 10, 20, 40, 80]
    weeks: [24]
    measures: [weight_change, fpg_change]
  - id: P-mho-15
    role: distractor        # blood pressure and LDL cholesterol
    split: test
    kind: RCT
    title: "{drug_f} for blood pressure and cholesterol in type 2 diabetes with high blood pressure"
    drug: drug_f
    context: t2d_hypertension
    doses: [3, 6]
    weeks: [12, 24]
    measures: [sbp_change, ldl_change, hba1c_change]
  - id: P-mho-16
    role: alias             # drug_f only by its code
    split: test
    kind: RCT
    title: "{drug_f_code} added to metformin: effects on blood pressure and LDL cholesterol"
    drug: drug_f
    context: t2d_metformin
    doses: [6]
    weeks: [12, 24]
    measures: [sbp_change, ldl_change]
    names: {drug_f: code}
  - id: P-mho-17
    role: hub               # people on insulin
    split: test
    kind: RCT
    title: "{drug_g} added to basal insulin in type 2 diabetes: a 26-week trial"
    drug: drug_g
    context: t2d_insulin
    doses: [5, 10, 20]
    weeks: [13, 26]
    measures: [hba1c_change, weight_change, fpg_change]
  - id: P-mho-18
    role: near_miss         # insulin group for drug_a
    split: test
    kind: RCT
    title: "{drug_a} added to basal insulin in type 2 diabetes"
    drug: drug_a
    context: t2d_insulin
    doses: [10]
    weeks: [26]
    measures: [hba1c_change, fpg_change]
  - id: P-mho-19
    role: multi_arm         # two drugs vs placebo in newly diagnosed adults; name and code together
    split: test
    kind: RCT
    title: "{drug_g} ({drug_g_code}) and {drug_b} as first treatment in newly diagnosed type 2 diabetes"
    arms: [{drug: drug_g, doses: [10]}, {drug: drug_b, doses: [50]}]
    context: t2d_naive
    weeks: [26]
    measures: [hba1c_change, weight_change]
    names: {drug_g: both}
  - id: P-mho-20
    role: series            # long follow-up of drug_e in obesity
    split: test
    kind: RCT
    title: "{drug_e} in type 2 diabetes with obesity: two-year follow-up"
    drug: drug_e
    context: t2d_obese
    doses: [20, 40]
    weeks: [52, 104]
    measures: [weight_change, hba1c_change]
